<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>portfolio — by rica</title>
    <meta name="description" content="Ricardo Jose Gagno (rica) — Graphic Designer · Layout Artist · Photographer, Iligan City, Philippines." />

    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

    <!-- Social preview. VITE_SITE_URL is set from Netlify's URL at build time
         (netlify.toml); crawlers need an absolute image URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="portfolio — by rica" />
    <meta property="og:description" content="Ricardo Jose Gagno — Graphic Designer · Layout Artist · Photographer." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Above the fold: the cover portrait and the cover title's faces. -->
    <!-- Same candidates as the <img> srcset, so the browser fetches one file, once. -->
    <link
      rel="preload"
      as="image"
      href="%BASE_URL%assets/hero/hero-portrait.webp"
      imagesrcset="%BASE_URL%assets/hero/hero-portrait-480.webp 480w, %BASE_URL%assets/hero/hero-portrait-960.webp 960w, %BASE_URL%assets/hero/hero-portrait-1440.webp 1440w, %BASE_URL%assets/hero/hero-portrait.webp 1948w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/rica-heros-bold.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="%BASE_URL%fonts/rica-heros-bolditalic.woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
