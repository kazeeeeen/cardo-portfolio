[build]
  command = "VITE_SITE_URL=$URL npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Hashed JS/CSS bundles never change under the same name.
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images keep their names when replaced, so cache for a week, not forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
